# Example Hyprland autostart for REM Bubbles.
#
# This file is tracked documentation. It is not read at runtime, and REM
# Bubbles never edits your Hyprland configuration itself.
#
# Ask for the line that matches your own installation:
#
#     rem-bubbles integration hyprland
#
# That prints an exec-once line with the absolute path of the rem-bubbles
# executable that is actually running, and prints it only — nothing is written
# and Hyprland is not reloaded. Paste the line into your hyprland.conf and start
# a new session.

# Start REM Bubbles with the session. Use the absolute path: a Hyprland session
# does not activate a virtual environment, so a bare "rem-bubbles" will not be
# found unless the executable is somewhere already on PATH.
exec-once = /path/to/rem-bubbles

# Optional. REM Bubbles sets the layer-shell namespace "rem-bubbles", so
# compositor rules can match it without guessing at a window title.
#
# layerrule = blur, rem-bubbles
