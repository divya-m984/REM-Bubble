# Example REM Bubbles configuration.
#
# The real one lives at ~/.config/rem-bubbles/config.toml (or
# $XDG_CONFIG_HOME/rem-bubbles/config.toml). Create it with:
#
#     rem-bubbles init
#
# This file is tracked sample data. It is not read at runtime.

[quotes]
# Where your personal quotes live. A relative path is resolved against the
# directory holding this config file, so the default means
# ~/.config/rem-bubbles/quotes.json. An absolute path or one starting with ~
# is also accepted, for keeping quotes somewhere else entirely.
file = "quotes.json"

[reminders]
# Where your personal reminders live. Same path rules as [quotes].
#
# This whole table is optional: leave it out and reminders still live at
# ~/.config/rem-bubbles/reminders.json. A config written before reminders
# existed needs no changes.
file = "reminders.json"

[notifications]
# Whether a reminder falling due also raises a desktop notification, alongside
# the REM Bubbles card. The card is the reminder; this is only an extra signal.
#
# Optional, and false unless you say otherwise. Updating REM Bubbles must never
# start putting notifications on your screen, so a config written before this
# table existed means the same thing as the line below.
#
# One notification per due episode: a recurring reminder notifies once per
# occurrence, a snooze notifies once more when it expires, and the thirty-second
# scheduler never repeats itself.
enabled = false
